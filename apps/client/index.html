<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jade Throne</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0f1210;
      }
      #game-container {
        position: absolute;
        inset: 0;
      }
      /* React overlay floats above the canvas; it must not eat mouse input. */
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* §11: buttons have hover and press states (loaded once, theme-agnostic). */
      button {
        transition:
          transform 80ms ease,
          filter 80ms ease;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.15);
      }
      button:active:not(:disabled) {
        transform: translateY(1px) scale(0.98);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
