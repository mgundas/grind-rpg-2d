  # Jade Throne production routing. Serves the client at / and the admin panel
  # at /admin/, and proxies REST + Colyseus matchmaking/WebSocket traffic.
  #
  # Behind an existing reverse proxy (nginx-proxy-manager), point its upstream
  # at this container's port 80; keep WebSocket upgrade headers enabled.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;

  # REST API and health.
  location ^~ /api/ {
    proxy_pass http://server:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Colyseus matchmaking (HTTP) and monitor.
  location ^~ /matchmake/ {
    proxy_pass http://server:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /colyseus {
    proxy_pass http://server:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Colyseus room WebSocket: /<processId>/<roomId>. Kept before the SPA
  # fallback so room connections never resolve to index.html.
  location ~ ^/[0-9]+/[A-Za-z0-9_-]+$ {
    proxy_pass http://server:2567;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Admin panel assets and SPA (Vite base is /admin/).
  location ^~ /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  # Immutable client assets.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
